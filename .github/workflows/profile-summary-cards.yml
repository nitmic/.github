name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      # 上流は Organization の Private リポジトリを集計しないため、
      # privacy: PUBLIC フィルタを外した nitmic のフォークを使用
      - uses: nitmic/github-profile-summary-cards@release
        env:
          # Private リポジトリの統計を含めるには repo スコープの PAT が必要
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 9
          EXCLUDE: ""
          AUTO_PUSH: true
